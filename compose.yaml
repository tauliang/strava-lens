name: strava-lens
x-app: &app
  build:
    context: .
    dockerfile: deploy/Dockerfile.api
  init: true
  environment:
    DATABASE_URL: postgresql+psycopg://lens:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/lens
    TRAINING_LENS_TOKEN: ${TRAINING_LENS_TOKEN:?Set TRAINING_LENS_TOKEN in .env}
    DATA_DIR: /data
    INBOX_DIR: /inbox
  volumes:
    - imports:/data
  depends_on:
    db:
      condition: service_healthy
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lens
      POSTGRES_USER: lens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U lens -d lens']
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    <<: *app
    command: [alembic, -c, backend/alembic.ini, upgrade, head]
  api:
    <<: *app
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/health',headers={'Authorization':'Bearer '+os.environ['TRAINING_LENS_TOKEN']}); urllib.request.urlopen(r,timeout=5).read()"
      interval: 10s
      timeout: 6s
      start_period: 20s
      retries: 6
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    <<: *app
    restart: unless-stopped
    command: [python, -m, strava_lens.worker]
    volumes:
      - imports:/data
      - type: bind
        source: ${STRAVA_INBOX_DIR:-${HOME}/StravaLens/inbox}
        target: /inbox
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    ports: ['127.0.0.1:${STRAVA_PORT:-8080}:8080']
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres:
  imports:
